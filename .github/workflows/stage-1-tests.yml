name: Stage 1 safety tests

on:
  push:
    branches:
      - main
      - "fix/stage-1-safe-rollback"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rollback-and-uninstall:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run Stage 1 tests
        run: bash tests/run.sh
